tags:
  - Contacts
summary: Get contacts
operationId: getContacts
description: Get all available contacts
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: string
      example: 1
  - in: query
    name: perPage
    schema:
      type: string
      example: 2
  - in: query
    name: sortOrder
    schema:
      type: string
      enum: ['asc', 'desc']
      example: asc
  - in: query
    name: sortBy
    schema:
      type: string
      enum: ['_id', 'name']
      example: _id
  - in: query
    name: isFavourite
    schema:
      type: boolean
      example: false

responses:
  '200':
    description: Get all available contacts
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              properties:
                data:
                  $ref: ../../components/schemas/contact.yaml
                page:
                  type: integer
                  example: 1
                perPage:
                  type: integer
                  example: 4
                totalItems:
                  type: integer
                  example: 23
                totalPages:
                  type: integer
                  example: 6
                hasPreviousPage:
                  type: boolean
                  example: false
                hasNextPage:
                  type: boolean
                  example: true

  '401':
    $ref: ../../components/responses/401.yaml
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: Contact not found
  '500':
    $ref: ../../components/responses/500.yaml
